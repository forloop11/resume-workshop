# Runs the tests on every push and pull request: `make test`, with what the
# editor's backend needs to build a resume (jsonschema, and the TeX packages
# input/format.tex uses); the editor's window, built and driven in the
# runner's Chrome (`make app-test`); and the app itself, built and driven
# through WebDriver on a display of its own (app/tests/window.mjs).
name: Test

on:
  push:
    branches: [main, "package-test/**"]
  pull_request:

permissions:
  contents: read

env:
  TEX_PACKAGES: texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make poppler-utils $TEX_PACKAGES
      - name: Install the pip packages
        run: python3 -m pip install -r requirements.txt
      - name: Run the tests
        run: make test
      - name: Check and test the editor's window
        run: |
          cd app
          npm ci
          npm run lint
          npm run build
          npm run smoke

  window:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the system packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
          build-essential webkit2gtk-driver xvfb $TEX_PACKAGES
      - name: Install the pip packages
        run: python3 -m pip install -r requirements.txt
      - name: Build the app
        run: |
          cd app
          npm ci
          npm run tauri build -- --no-bundle
      - name: Drive the app's window
        run: |
          cargo install tauri-driver --locked
          cd app
          xvfb-run --auto-servernum npm run window

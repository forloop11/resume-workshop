name: LaTeX to PDF and TXT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_latex:
    # --- NEW ---
    # This block grants the workflow permission to write to the repository.
    permissions:
      contents: write
    # --- END NEW ---

    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build LaTeX document
      - name: Build LaTeX document
        uses: docker://ghcr.io/xu-cheng/texlive-full:latest
        with:
          args: pdflatex -interaction=nonstopmode main.tex

      # We are removing the "Upload Artifact" steps because we are
      # committing the files directly to the repository instead.

      # Step 3: Convert TeX to TXT using Pandoc
      - name: Convert TeX to TXT with Pandoc
        uses: docker://pandoc/core:latest
        with:
          args: --wrap=none -f latex -t plain main.tex -o todd_takala_resume.txt

      # --- NEW ---
      # Step 4: Commit and push the generated files if they have changed
      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated build: Add generated PDF and TXT files"
          # Add both the PDF and TXT files to the commit
          file_pattern: "*.pdf *.txt"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
      # --- END NEW ---

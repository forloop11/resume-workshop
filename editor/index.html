<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Resume Workshop</title>
<style>
:root { color-scheme: dark; --ink:#f8f8f2; --muted:#a6acc5; --line:#44475a; --paper:#282a36; --wash:#191a21; --accent:#bd93f9; --accent-dark:#ff79c6; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:linear-gradient(135deg,#191a21 0%,#282a36 55%,#20212b 100%); font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
header { padding:28px 5vw 20px; display:flex; justify-content:space-between; align-items:end; gap:20px; }
h1 { margin:0; font:700 clamp(1.8rem,4vw,3.2rem)/1 Georgia,serif; letter-spacing:0; }
header p { max-width:48rem; margin:8px 0 0; color:var(--muted); font-family:ui-sans-serif,system-ui,sans-serif; }
main { width:min(1400px,90vw); margin:0 auto 40px; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr); gap:18px; }
.panel { background:rgba(40,42,54,.94); border:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.28); }
.tabs { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#21222c; }
.tab { border:0; border-right:1px solid var(--line); padding:13px 15px; background:transparent; color:var(--muted); cursor:pointer; font:inherit; }
.tab.active { color:var(--ink); background:var(--paper); box-shadow:inset 0 -3px var(--accent); }
.editor { width:100%; min-height:650px; display:block; resize:vertical; border:0; padding:22px; color:var(--ink); background:var(--paper); outline:none; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; }
.editor-shell { position:relative; }
.editor-shell .highlight { position:absolute; inset:0; margin:0; padding:22px; overflow:auto; pointer-events:none; white-space:pre-wrap; word-wrap:break-word; color:var(--ink); background:var(--paper); font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; }
.editor-shell.nowrap .highlight, .editor-shell.nowrap .editor { white-space:pre; }
.highlight .cmd { color:#ff79c6; font-weight:600; }
.highlight .key { color:#8be9fd; font-weight:600; }
.editor-shell .editor { position:relative; background:transparent; color:transparent; caret-color:#f8f8f2; white-space:pre-wrap; word-wrap:break-word; }
.actions { padding:15px; display:flex; flex-wrap:wrap; gap:8px; border-top:1px solid var(--line); }
button { border:1px solid var(--line); background:#44475a; color:var(--ink); padding:9px 12px; cursor:pointer; font:inherit; }
button:hover { border-color:var(--accent); color:#ff79c6; } button.primary { background:var(--accent); border-color:var(--accent); color:#282a36; } button.primary:hover { background:#ff79c6; color:#282a36; }
.side { padding:18px; } h2 { margin:0 0 14px; font:700 1.2rem Georgia,serif; } .target-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pdf { margin-top:18px; width:100%; height:max(1000px, calc(100vh - 100px)); border:1px solid var(--line); background:#6272a4; }
@media (max-width:850px) { header { display:block; } main { grid-template-columns:1fr; } .editor { min-height:500px; } .pdf { height:1800px; } }
.tab.dirty::after { content:" •"; color:#ffb86c; }
.status { margin:8px 0 0; min-height:1.45em; color:var(--muted); font-family:ui-sans-serif,system-ui,sans-serif; }
.status.ok { color:#50fa7b; } .status.error { color:#ff5555; }
.make-output { margin-top:12px; } .make-output summary { cursor:pointer; color:var(--muted); } .make-output pre { max-height:260px; overflow:auto; margin:8px 0 0; padding:10px; background:var(--wash); font-size:12px; white-space:pre-wrap; }
</style>
<link rel="stylesheet" href="blocks.css">
</head>
<body>
<header><div><h1>Resume Workshop</h1><p>Edit source files, run the pipeline, and inspect the generated PDF from one window.</p><p class="status" id="status" role="status"></p></div><button id="openPdf">Open PDF</button></header>
<main>
<section class="panel"><nav class="tabs" id="tabs"></nav>
<div id="blocks" hidden><div class="actions blocks-actions"><button class="primary" id="blocksSave">Save</button><button id="blocksBuild">Save &amp; build</button><button id="blocksUndo" disabled>Undo</button><button id="blocksExpand">Expand all</button><button id="blocksCollapse">Collapse all</button><button id="blocksReload">Reload</button><span class="insert-chars" title="Insert at the cursor in the last field you clicked">Insert <button data-insert="·" title="Middle dot (printed as $\cdot$)">·</button><button data-insert="–" title="En dash (printed as --)">–</button></span></div><div id="blocksBody"></div></div>
<div id="rawEditor"><div class="editor-shell" id="editorShell"><pre class="highlight" id="highlight" aria-hidden="true"><code id="highlightCode"></code></pre><textarea class="editor" id="editor" spellcheck="true"></textarea></div><div class="actions"><button class="primary" id="save">Save file</button><button id="reload">Reload file</button><button id="format">Pretty-print JSON</button><button id="wrap">Wrap: On</button></div></div></section>
<aside class="panel side"><h2>Make targets</h2><div class="target-grid" id="targets"></div><details class="make-output" id="makeOutput" hidden><summary>Last make output</summary><pre id="makeLog"></pre></details><iframe class="pdf" id="pdf" title="Generated resume PDF"></iframe></aside>
</main>
<script>
// BLOCKS is the "Resume (blocks)" tab (blocks.js), which edits resume.json and section_order.yaml together; every other tab is a raw file.
const BLOCKS = '__blocks__';
// Files the blocks tab fully covers: still loaded and saved, but not shown as their own raw tab.
const NO_TAB = new Set(['section_order.yaml']);
const state = { files: {}, saved: {}, active: null };
const tabs = document.querySelector('#tabs'), editor = document.querySelector('#editor'), highlightEl = document.querySelector('#highlight'), highlightCode = document.querySelector('#highlightCode'), formatBtn = document.querySelector('#format'), editorShell = document.querySelector('#editorShell'), wrapBtn = document.querySelector('#wrap'), statusEl = document.querySelector('#status');
let wrapEnabled = true;
function report(message, kind = '') { console.log(message); statusEl.textContent = message; statusEl.className = 'status ' + kind; }
function isDirty(name) { return name === BLOCKS ? isDirty('resume.json') || isDirty('section_order.yaml') : state.files[name] !== state.saved[name]; }
function anyDirty() { return Object.keys(state.files).some(isDirty); }
function toggleWrap() { wrapEnabled = !wrapEnabled; editorShell.classList.toggle('nowrap', !wrapEnabled); wrapBtn.textContent = wrapEnabled ? 'Wrap: On' : 'Wrap: Off'; }
function escapeHtml(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function renderHighlight() { const isJson = state.active && state.active.endsWith('.json'); const pattern = isJson ? /"(?:[^"\\]|\\.)*"(?=\s*:)|\\(?:[a-zA-Z@]+\*?|[^a-zA-Z@\\])/g : /\\(?:[a-zA-Z@]+\*?|[^a-zA-Z@\\])/g; const text = editor.value; let html = '', last = 0, match; while ((match = pattern.exec(text))) { const cls = match[0][0] === '"' ? 'key' : 'cmd'; html += escapeHtml(text.slice(last, match.index)) + `<span class="${cls}">${escapeHtml(match[0])}</span>`; last = match.index + match[0].length; } highlightCode.innerHTML = html + escapeHtml(text.slice(last)) + '\n'; }
function renderTabs() { tabs.innerHTML = ''; [BLOCKS, ...Object.keys(state.files).filter(name => !NO_TAB.has(name))].forEach(name => { const button = document.createElement('button'); button.className = 'tab' + (name === state.active ? ' active' : '') + (isDirty(name) ? ' dirty' : ''); button.textContent = name === BLOCKS ? 'Resume (blocks)' : name; button.onclick = () => selectFile(name); tabs.append(button); }); }
function updateFormatButton() { formatBtn.style.display = state.active && state.active.endsWith('.json') ? '' : 'none'; }
function syncEditor() { if (state.active && state.active !== BLOCKS) state.files[state.active] = editor.value; }
function selectFile(name) { syncEditor(); state.active = name; const blocks = name === BLOCKS; document.querySelector('#blocks').hidden = !blocks; document.querySelector('#rawEditor').hidden = blocks; if (blocks) Blocks.open(); else { editor.value = state.files[name]; renderHighlight(); updateFormatButton(); } renderTabs(); }
async function loadFiles() { if (anyDirty() && !confirm('Discard unsaved changes and reload all files from disk?')) return; const data = await workshop.files(); const active = state.active === BLOCKS || (data.files[state.active] !== undefined && !NO_TAB.has(state.active)) ? state.active : null; state.files = data.files; state.saved = { ...data.files }; state.active = null; Blocks.reset(); selectFile(active || BLOCKS); }
async function save() { syncEditor(); if (state.active.endsWith('.json')) { try { JSON.parse(editor.value); } catch (error) { report(`Cannot save ${state.active}: invalid JSON — ${error.message}`, 'error'); return; } } const name = state.active, content = editor.value; try { const data = await workshop.save(name, content); state.saved[name] = content; renderTabs(); report(data.message, 'ok'); } catch (error) { report(error.message, 'error'); } }
function formatJson() { try { editor.value = JSON.stringify(JSON.parse(editor.value), null, 2); state.files[state.active] = editor.value; renderHighlight(); renderTabs(); report(`Formatted ${state.active}. Click "Save file" to persist.`); } catch (error) { report(`Cannot format ${state.active}: ${error.message}`, 'error'); } }
function showPdf(url) { if (url) document.querySelector('#pdf').src = url; }
function showMakeOutput(text) { document.querySelector('#makeLog').textContent = text; document.querySelector('#makeOutput').hidden = !text; }
async function run(target) { syncEditor(); report(`Running make ${target}...`); try { const data = await workshop.make(target); showMakeOutput(data.output); report(`make ${target} completed.`, 'ok'); showPdf(data.pdf); } catch (error) { showMakeOutput(error.message); document.querySelector('#makeOutput').open = true; report(`make ${target} failed — see "Last make output".`, 'error'); } }
editor.addEventListener('input', () => { renderHighlight(); state.files[state.active] = editor.value; renderTabs(); });
editor.addEventListener('scroll', () => { highlightEl.scrollTop = editor.scrollTop; highlightEl.scrollLeft = editor.scrollLeft; });
window.addEventListener('beforeunload', event => { syncEditor(); if (anyDirty()) event.preventDefault(); });
document.querySelector('#save').onclick = save; document.querySelector('#reload').onclick = document.querySelector('#blocksReload').onclick = () => loadFiles().catch(error => report(error.message, 'error')); document.querySelector('#openPdf').onclick = () => workshop.openPdf().catch(error => report(error.message, 'error')); formatBtn.onclick = formatJson; wrapBtn.onclick = toggleWrap;
workshop.config.targets.forEach(target => { const button = document.createElement('button'); button.textContent = 'make ' + target; button.onclick = () => run(target); document.querySelector('#targets').append(button); });
workshop.pdf().then(data => showPdf(data.url)).catch(error => report(error.message, 'error'));
</script>
<script src="Sortable.min.js"></script>
<script src="blocks.js"></script>
<script>loadFiles().catch(error => report(error.message, 'error'));</script>
</body>
</html>

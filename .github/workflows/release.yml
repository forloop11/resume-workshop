# Builds the editor for Linux, macOS, and Windows (packaging/build_app.py),
# and publishes a release when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# builds it as that version and attaches the files to a new GitHub release.
# Their names stay the same from release to release: the editor's Help >
# Check for Updates (app/backend/update.py) looks for the AppImage on the
# latest release.
#
# A branch named package-test/... is built the same way without publishing
# anything, to try a change to the packaging; the files are kept with the
# run, as artifacts.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: ["package-test/**"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Linux runner there is: the AppImage carries this
          # machine's web view, and runs on systems at least as new.
          - os: ubuntu-22.04
            bundles: --bundles appimage,deb,rpm
          - os: macos-latest
            bundles: ""
          - os: windows-latest
            bundles: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # for the version, from the last tag
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the system packages Tauri builds with
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
          build-essential curl file patchelf libfuse2 xdg-utils rpm
      - name: Build the app
        run: python packaging/build_app.py ${{ matrix.bundles }}
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Check the AppImage
        if: runner.os == 'Linux'
        run: |
          dist/Resume_Workshop-x86_64.AppImage --appimage-extract "usr/lib/Resume Workshop/app/backend/VERSION" >/dev/null
          cat "squashfs-root/usr/lib/Resume Workshop/app/backend/VERSION"
          test "$GITHUB_REF_TYPE" != tag || test "v$(cat "squashfs-root/usr/lib/Resume Workshop/app/backend/VERSION")" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v5
        with:
          name: resume-workshop-${{ matrix.os }}
          path: dist/Resume_Workshop-*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "Resume Workshop ${GITHUB_REF_NAME#v}"
          dist/Resume_Workshop-*
        env:
          GH_TOKEN: ${{ github.token }}

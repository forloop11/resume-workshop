<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Workshop</title>
<style>
:root { color-scheme: dark; --ink:#f8f8f2; --muted:#a6acc5; --line:#44475a; --paper:#282a36; --wash:#191a21; --accent:#bd93f9; --accent-dark:#ff79c6; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:linear-gradient(135deg,#191a21 0%,#282a36 55%,#20212b 100%); font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
header { padding:28px 5vw 20px; display:flex; justify-content:space-between; align-items:end; gap:20px; }
h1 { margin:0; font:700 clamp(1.8rem,4vw,3.2rem)/1 Georgia,serif; letter-spacing:0; }
header p { max-width:48rem; margin:8px 0 0; color:var(--muted); font-family:ui-sans-serif,system-ui,sans-serif; }
main { width:min(1400px,90vw); margin:0 auto 40px; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr); gap:18px; }
.panel { background:rgba(40,42,54,.94); border:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.28); }
.tabs { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line); background:#21222c; }
.tab { border:0; border-right:1px solid var(--line); padding:13px 15px; background:transparent; color:var(--muted); cursor:pointer; font:inherit; }
.tab.active { color:var(--ink); background:var(--paper); box-shadow:inset 0 -3px var(--accent); }
.editor { width:100%; min-height:650px; display:block; resize:vertical; border:0; padding:22px; color:var(--ink); background:var(--paper); outline:none; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; }
.editor-shell { position:relative; }
.editor-shell .highlight { position:absolute; inset:0; margin:0; padding:22px; overflow:auto; pointer-events:none; white-space:pre-wrap; word-wrap:break-word; color:var(--ink); background:var(--paper); font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; }
.editor-shell.nowrap .highlight, .editor-shell.nowrap .editor { white-space:pre; }
.highlight .cmd { color:#ff79c6; font-weight:600; }
.highlight .key { color:#8be9fd; font-weight:600; }
.editor-shell .editor { position:relative; background:transparent; color:transparent; caret-color:#f8f8f2; white-space:pre-wrap; word-wrap:break-word; }
.actions { padding:15px; display:flex; flex-wrap:wrap; gap:8px; border-top:1px solid var(--line); }
button { border:1px solid var(--line); background:#44475a; color:var(--ink); padding:9px 12px; cursor:pointer; font:inherit; }
button:hover { border-color:var(--accent); color:#ff79c6; } button.primary { background:var(--accent); border-color:var(--accent); color:#282a36; } button.primary:hover { background:#ff79c6; color:#282a36; }
.side { padding:18px; } h2 { margin:0 0 14px; font:700 1.2rem Georgia,serif; } .target-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pdf { margin-top:18px; width:100%; height:max(1000px, calc(100vh - 100px)); border:1px solid var(--line); background:#6272a4; }
@media (max-width:850px) { header { display:block; } main { grid-template-columns:1fr; } .editor { min-height:500px; } .pdf { height:1800px; } }
</style>
</head>
<body>
<header><div><h1>Resume Workshop</h1><p>Edit source files, run the pipeline, and inspect the generated PDF from one local page.</p></div><button id="openPdf">Open PDF</button></header>
<main>
<section class="panel"><nav class="tabs" id="tabs"></nav><div class="editor-shell" id="editorShell"><pre class="highlight" id="highlight" aria-hidden="true"><code id="highlightCode"></code></pre><textarea class="editor" id="editor" spellcheck="true"></textarea></div><div class="actions"><button class="primary" id="save">Save file</button><button id="reload">Reload file</button><button id="format">Pretty-print JSON</button><button id="wrap">Wrap: On</button></div></section>
<aside class="panel side"><h2>Make targets</h2><div class="target-grid" id="targets"></div><iframe class="pdf" id="pdf" title="Generated resume PDF"></iframe></aside>
</main>
<script>
const state = { files: {}, active: null };
const tabs = document.querySelector('#tabs'), editor = document.querySelector('#editor'), highlightEl = document.querySelector('#highlight'), highlightCode = document.querySelector('#highlightCode'), formatBtn = document.querySelector('#format'), editorShell = document.querySelector('#editorShell'), wrapBtn = document.querySelector('#wrap');
let wrapEnabled = true;
function report(message) { console.log(message); }
function toggleWrap() { wrapEnabled = !wrapEnabled; editorShell.classList.toggle('nowrap', !wrapEnabled); wrapBtn.textContent = wrapEnabled ? 'Wrap: On' : 'Wrap: Off'; }
function escapeHtml(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function renderHighlight() { const isJson = state.active && state.active.endsWith('.json'); const pattern = isJson ? /"(?:[^"\\]|\\.)*"(?=\s*:)|\\(?:[a-zA-Z@]+\*?|[^a-zA-Z@\\])/g : /\\(?:[a-zA-Z@]+\*?|[^a-zA-Z@\\])/g; const text = editor.value; let html = '', last = 0, match; while ((match = pattern.exec(text))) { const cls = match[0][0] === '"' ? 'key' : 'cmd'; html += escapeHtml(text.slice(last, match.index)) + `<span class="${cls}">${escapeHtml(match[0])}</span>`; last = match.index + match[0].length; } highlightCode.innerHTML = html + escapeHtml(text.slice(last)) + '\n'; }
async function request(url, options) { const response = await fetch(url, options); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Request failed'); return data; }
function renderTabs() { tabs.innerHTML = ''; Object.keys(state.files).forEach(name => { const button = document.createElement('button'); button.className = 'tab' + (name === state.active ? ' active' : ''); button.textContent = name; button.onclick = () => selectFile(name); tabs.append(button); }); }
function updateFormatButton() { formatBtn.style.display = state.active && state.active.endsWith('.json') ? '' : 'none'; }
function selectFile(name) { if (state.active) state.files[state.active] = editor.value; state.active = name; editor.value = state.files[name]; renderTabs(); renderHighlight(); updateFormatButton(); }
async function loadFiles() { const data = await request('/api/files'); state.files = data.files; state.active = Object.keys(state.files)[0]; editor.value = state.files[state.active]; renderTabs(); renderHighlight(); updateFormatButton(); }
async function save() { state.files[state.active] = editor.value; if (state.active.endsWith('.json')) { try { JSON.parse(editor.value); } catch (error) { report(`Cannot save ${state.active}: invalid JSON — ${error.message}`); return; } } const data = await request('/api/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:state.active, content:editor.value}) }); report(data.message); }
function formatJson() { try { editor.value = JSON.stringify(JSON.parse(editor.value), null, 2); state.files[state.active] = editor.value; renderHighlight(); report(`Formatted ${state.active}. Click "Save file" to persist.`); } catch (error) { report(`Cannot format ${state.active}: ${error.message}`); } }
async function run(target) { state.files[state.active] = editor.value; report(`Running make ${target}...`); try { const data = await request('/api/make', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target}) }); report(data.output); if (target === 'build' || target === 'user') document.querySelector('#pdf').src = '/output/resume.pdf?ts=' + Date.now(); } catch (error) { report(error.message); } }
editor.addEventListener('input', renderHighlight);
editor.addEventListener('scroll', () => { highlightEl.scrollTop = editor.scrollTop; highlightEl.scrollLeft = editor.scrollLeft; });
document.querySelector('#save').onclick = save; document.querySelector('#reload').onclick = loadFiles; document.querySelector('#openPdf').onclick = () => window.open('/output/resume.pdf', '_blank'); formatBtn.onclick = formatJson; wrapBtn.onclick = toggleWrap;
request('/api/targets').then(data => data.targets.forEach(target => { const button = document.createElement('button'); button.textContent = 'make ' + target; button.onclick = () => run(target); document.querySelector('#targets').append(button); })).catch(error => report(error.message));
loadFiles().catch(error => report(error.message));
</script>
</body>
</html>
